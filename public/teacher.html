<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서술형 연습 · 교사</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top"><div class="wrap wide">
  <span class="logo">🔥 서술형 연습 · 교사</span>
  <select id="classSel" aria-label="반 선택" hidden></select>
  <button id="newClass" hidden>+ 반 만들기</button>
  <span class="grow"></span>
  <button id="csv" hidden>CSV 내보내기</button>
  <button id="boardBtn" hidden>큰 화면</button>
  <label class="row muted" style="gap:4px" id="maskWrap" hidden><input type="checkbox" id="mask"> 이름 가리기</label>
  <span class="who" id="who"></span>
  <button class="ghost" id="logout" hidden>로그아웃</button>
</div></header>
<main class="wrap wide" id="app"><p class="muted">불러오는 중…</p></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>

</html>
